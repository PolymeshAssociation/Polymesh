[package]
name = "polymesh-primitives"
version = "5.0.0"
authors = [ "Polymesh Association" ]
license-file = "../LICENSE"
repository = "https://github.com/PolymeshAssociation/Polymesh"
description = "Polymesh Primitives"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false }
serde = { version = "1.0.104", default-features = false, features = ["alloc", "derive"] }
serde_bytes = { version = "0.11.14", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6", default-features = false }
rand = { version = "0.8", default-features = false, optional = true }
rustc-hex = { version = "2.1.0", default-features = false }
either = { version = "1.6.1", default-features = false }
log = "0.4"

# Ours
polymesh-primitives-derive = { version = "0.1.0", path = "../primitives_derive", default-features = false }

# Crypto
schnorrkel = { version = "0.11", default-features = false }

# Substrate
codec = { workspace = true, default-features = false, features = ["derive"] }
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
scale-info = { workspace = true, default-features = false, features = ["derive", "decode"] }
sp-application-crypto = { workspace = true, default-features = false, optional = true }
sp-arithmetic = { workspace = true, default-features = false }
sp-core = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-runtime-interface = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-version = { workspace = true, default-features = false }
libsecp256k1 = { version = "0.7", default-features = false, features = ["hmac", "static-context"] }

[dev-dependencies]
hex = { version = "^0.4.0", default-features = false }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[features]
default = ["std"]

# Backends
u64_backend = []

no_std = ["u64_backend"]

std = [
		"u64_backend",
    "chrono/std",
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "serde/std",
    "serde_bytes/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime-interface/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-version/std",

    # Crypto
    "polymesh-primitives-derive/std",
    "schnorrkel/std",
    "sp-application-crypto/std",

    # Rng
    "rand/std",
    "rand/std_rng",
    "rand_core/std",
]

runtime-benchmarks = []
running-ci = []
