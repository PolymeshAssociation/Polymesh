version: 2.1
commands:
  get-solc:
    steps:
      - run:
          name: Get solc
          command: |
            SOLC_VERSION="0.8.33"
            ASSET_URL="https://github.com/argotorg/solidity/releases/download/v${SOLC_VERSION}/solc-static-linux"
            echo "Downloading solc version ${SOLC_VERSION} from ${ASSET_URL}"
            curl -sSL --output /usr/local/bin/solc ${ASSET_URL}
            chmod +x /usr/local/bin/solc
  get-resolc:
    steps:
      - run:
          name: Get resolc
          command: |
            RESOLC_VERSION="0.6.0"
            ASSET_URL="https://github.com/paritytech/revive/releases/download/v${RESOLC_VERSION}/resolc-x86_64-unknown-linux-musl"
            echo "Downloading resolc version ${RESOLC_VERSION} from ${ASSET_URL}"
            curl -sSL --output /usr/local/bin/resolc ${ASSET_URL}
            chmod +x /usr/local/bin/resolc
  setup-sccache:
    steps:
      - run:
          name: Setup sccache
          command: |
            # This configures Rust to use sccache.
            echo 'export "RUSTC_WRAPPER"="/usr/local/cargo/bin/sccache"' >> $BASH_ENV
            # This is the maximum space sccache cache will use on disk.
            echo 'export "SCCACHE_CACHE_SIZE"="2G"' >> $BASH_ENV
            /usr/local/cargo/bin/sccache --version
  restore-sccache-cache:
    steps:
      - run:
          name: Store rust version in a file for cache key
          command: rustc --version > rust.version
      - restore_cache:
          name: Restore sccache cache
          key: sccache-cache-stable-v2-{{ checksum "./rust.version" }}-{{ checksum "./Cargo.lock" }}-{{ checksum "./integration/Cargo.lock" }}-{{ arch }}-{{ .Environment.CIRCLE_JOB }}
      - run:
          name: Show cache size
          command: /usr/local/cargo/bin/sccache -s
  save-sccache-cache:
    steps:
      - run:
          name: Show cache size
          command: /usr/local/cargo/bin/sccache -s
      - save_cache:
          name: Save sccache cache
          # We use {{ epoch }} to always upload a fresh cache:
          # Of course, restore_cache will not find this exact key,
          # but it will fall back to the closest key (aka the most recent).
          # See https://discuss.circleci.com/t/add-mechanism-to-update-existing-cache-key/9014/13
          key: sccache-cache-stable-v2-{{ checksum "./rust.version" }}-{{ checksum "./Cargo.lock" }}-{{ checksum "./integration/Cargo.lock" }}-{{ arch }}-{{ .Environment.CIRCLE_JOB }}-{{ epoch }}
          paths:
            - "/usr/local/cargo"
            - "~/.cache/sccache"
jobs:
  lint:
    docker:
      - image: polymeshassociation/rust:debian-nightly-2025-12-01
    resource_class: small
    environment:
      VERBOSE: "1"
    steps:
      - checkout
      - run:
          name: Check formatting
          command: ./scripts/rustfmt.sh
      - run:
          name: Check runtime spec versions and polymesh crate version.
          command: ./scripts/check_spec_and_cargo_version.sh
  check-storage-version:
    docker:
      - image: polymeshassociation/rust:debian-nightly-2025-12-01
    resource_class: small
    environment:
      VERBOSE: "1"
    steps:
      - checkout
      - run:
          name: Check Storage versions
          command: ./scripts/check_storage_versions.sh
  build:
    docker:
      - image: polymeshassociation/rust:debian-nightly-2025-12-01
    resource_class: xlarge
    environment:
      - VERBOSE: "1"
      - RUSTFLAGS: -D warnings
      - RUSTC_WRAPPER: /usr/local/cargo/bin/sccache
    steps:
      - checkout
      - setup-sccache
      - restore-sccache-cache
      - run:
          name: Build release
          command: cargo build --locked --release
          no_output_timeout: 30m
      - run:
          name: Build eth-rpc
          command: cargo build --locked --release -p pallet-revive-eth-rpc --bin eth-rpc
          no_output_timeout: 30m
      - run:
          name: Create assets directory for releases
          command: mkdir ./assets
      - run:
          name: Copy binary to assets
          command: cp ./target/release/polymesh ./assets/polymesh
      - run:
          name: Copy eth-rpc binary to assets
          command: cp ./target/release/eth-rpc ./assets/eth-rpc
      ## This has been commented out due to deterministic wasm build step added
      # - run:
      #     name: Copy wasm to assets
      #     command: cp ./target/release/wbuild/polymesh*/*wasm ./assets/
      - persist_to_workspace:
          root: ./assets
          paths:
            - .
      - save-sccache-cache
  build-ci:
    docker:
      - image: polymeshassociation/rust:debian-nightly-2025-12-01
    resource_class: xlarge
    environment:
      - VERBOSE: "1"
      - RUSTFLAGS: -D warnings
    steps:
      - checkout
      - setup-sccache
      - restore-sccache-cache
      - run:
          name: Build ci-runtime
          command: cargo build --locked --release --features ci-runtime
          no_output_timeout: 30m
      - save-sccache-cache
      - run:
          name: Create assets directory for release files.
          command: mkdir -p ./assets/ci-runtime
      - run:
          name: Copy binary to assets
          command: cp ./target/release/polymesh ./assets/ci-runtime/polymesh
      - run:
          name: Copy wasm to assets
          command: cp ./target/release/wbuild/polymesh*/*wasm ./assets/ci-runtime/
      - persist_to_workspace:
          root: ./assets/ci-runtime
          paths:
            - .
  build-arm64:
    docker:
      - image: polymeshassociation/rust-arm64:debian-nightly-2025-12-01
    resource_class: arm.xlarge
    environment:
      - VERBOSE: "1"
      - RUSTFLAGS: -D warnings
      - RUSTC_WRAPPER: /usr/local/cargo/bin/sccache
    steps:
      - checkout
      - setup-sccache
      - restore-sccache-cache
      - run:
          name: Build release
          command: cargo build --locked --release
          no_output_timeout: 30m
      - run:
          name: Build eth-rpc
          command: cargo build --locked --release -p pallet-revive-eth-rpc --bin eth-rpc
          no_output_timeout: 30m
      - run:
          name: Create assets directory for releases
          command: mkdir ./assets
      - run:
          name: Copy arm64 binary to assets
          command: cp ./target/release/polymesh ./assets/polymesh-arm64
      - run:
          name: Copy arm64 eth-rpc binary to assets
          command: cp ./target/release/eth-rpc ./assets/eth-rpc-arm64
      - persist_to_workspace:
          root: ./assets
          paths:
            - .
      - save-sccache-cache
  benchmark-build:
    docker:
      - image: polymeshassociation/rust:debian-nightly-2025-12-01
    resource_class: xlarge
    environment:
      - VERBOSE: "1"
      - RUSTFLAGS: -D warnings
      - RUSTC_WRAPPER: /usr/local/cargo/bin/sccache
    steps:
      - checkout
      - setup-sccache
      - restore-sccache-cache
      - get-solc
      - get-resolc
      - run:
          name: Build binary with runtime-benchmarks
          command: cargo build --locked --release --features=runtime-benchmarks,running-ci
          no_output_timeout: 30m
      - run:
          name: Rename the benchmarks binary.
          command: mv ./target/release/polymesh ./polymesh-benchmarks
      - persist_to_workspace:
          root: ./
          paths:
            - polymesh-benchmarks
      - save-sccache-cache

  deterministic-wasm-build:
    parameters:
      chain:
        type: enum
        enum:
          - "testnet"
          - "mainnet"
          - "develop"
        default: "mainnet"
        description: "Name of the chain, ie. mainnet"
      package:
        type: string
        default: "wasm"
        description: >
          Runtime package to build, ie. polkadot-runtime.
          If your runtime follows this pattern, you don't have and should not provide this input.

          If not provided, it will be set to <chain>-runtime
      image:
        type: string
        default: "paritytech/srtool"
        description: >
          You can use an alternate image, use with caution!
      tag:
        type: string
        default: "latest"
        description: "Tag of the srtool image to use. Omit to use the latest (recommended)"
      workdir:
        type: string
        default: "."
        description: "Path of the project, this is where your main Cargo.toml is located."
      runtime_dir:
        type: string
        default: "runtime/testnet"
        description: "Location of the runtime in your repo. The default is 'runtime/<chain_name>'"
      profile:
        type: string
        default: "release"
        description: "Which profile to use with cargo build."
      build_opts:
        type: string
        default: " --features on-chain-release-build "
        description: "Additional options to pass to cargo build."
      parachain_pallet_id:
        type: string
        default: "0x01"
        description: "The patachain's pallet id."
      authorize_upgrade_prefix:
        type: string
        default: "0x02"
        description: "The authorize_upgrade call ID."

    docker:
      - image: <<parameters.image>>:<<parameters.tag>>
    resource_class: xlarge
    working_directory: /build
    environment:
      # https://github.com/paritytech/polkadot-sdk/pull/2217
      WASM_BUILD_STD: "0"

      PACKAGE: <<parameters.package>>
      RUNTIME_DIR: <<parameters.runtime_dir>>
      BUILD_OPTS: <<parameters.build_opts>>
      PARACHAIN_PALLET_ID: <<parameters.parachain_pallet_id>>
      AUTHORIZE_UPGRADE_PREFIX: <<parameters.authorize_upgrade_prefix>>
      PROFILE: <<parameters.profile>>
    steps:
      - checkout
      - attach_workspace:
          at: ./assets
      - run:
          name: Use rust-toolchain.toml
          command: cp rust-toolchain.toml pallets/runtime/<<parameters.chain>>/rust-toolchain.toml
      - run:
          name: Build the deterministic wasm binary
          command: |
            CMD="/srtool/build --app --json -cM"
            stdbuf -oL $CMD | {
              while IFS= read -r line
              do
                echo ║ $line
                JSON="$line"
              done

              echo "========================================="
              echo $JSON | jq .
              echo "========================================="
              echo $JSON | jq . > ./assets/<<parameters.chain>>-srtool-digest.json
              echo "prop: $(echo $JSON | jq -r .runtimes.compressed.prop)"
              cp $(echo $JSON | jq -r .runtimes.compressed.wasm) ./assets/polymesh_runtime_<<parameters.chain>>.compact.compressed.wasm
              echo "========================================="
            }
      - store_artifacts:
          path: ./assets/<<parameters.chain>>-srtool-digest.json
      - store_artifacts:
          path: ./assets/polymesh_runtime_<<parameters.chain>>.compact.compressed.wasm
      - persist_to_workspace:
          root: ./assets
          paths:
            - .

  metadata-tools-build:
    docker:
      - image: polymeshassociation/rust:debian-nightly-2025-12-01
    resource_class: small
    steps:
      - checkout
      - setup-sccache
      - restore-sccache-cache
      - run:
          name: Build metadata-tools
          command: |
            cd metadata-tools
            cargo build --release
      - persist_to_workspace:
          root: ./metadata-tools/target/release/
          paths:
            - metadata-tools
      - save-sccache-cache

  check_dev_api:
    docker:
      - image: debian:stable
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: ./assets
      - run:
          name: Start Polymesh dev chain
          command: >-
            ./assets/polymesh --dev \
              --no-prometheus --no-telemetry --tmp \
              --wasm-execution compiled \
              --pool-limit 100000
          background: true
      - run:
          name: Wait for chain to start
          command: sleep 30
      - run:
          name: Run metadata-tools check
          command: |
            ./assets/metadata-tools check .metadata ws://localhost:9944 | tee runtime_dev_api_report.txt || true
      - store_artifacts:
          path: runtime_dev_api_report.txt
          destination: runtime_dev_api_report.txt

  check_testnet_api:
    docker:
      - image: debian:stable
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: ./assets
      - run:
          name: Start Polymesh testnet chain
          command: >-
            ./assets/polymesh --chain testnet-dev \
              --no-prometheus --no-telemetry --tmp \
              --wasm-execution compiled \
              --pool-limit 100000
          background: true
      - run:
          name: Wait for chain to start
          command: sleep 30
      - run:
          name: Run metadata-tools check
          command: |
            ./assets/metadata-tools check .metadata ws://localhost:9944 | tee runtime_testnet_api_report.txt
      - store_artifacts:
          path: runtime_testnet_api_report.txt
          destination: runtime_testnet_api_report.txt

  check_mainnet_api:
    docker:
      - image: debian:stable
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: ./assets
      - run:
          name: Start Polymesh mainnet chain
          command: >-
            ./assets/polymesh --chain mainnet-dev \
              --no-prometheus --no-telemetry --tmp \
              --wasm-execution compiled \
              --pool-limit 100000
          background: true
      - run:
          name: Wait for chain to start
          command: sleep 30
      - run:
          name: Run metadata-tools check
          command: |
            ./assets/metadata-tools check .metadata ws://localhost:9944 | tee runtime_mainnet_api_report.txt
      - store_artifacts:
          path: runtime_mainnet_api_report.txt
          destination: runtime_mainnet_api_report.txt

  benchmark:
    docker:
      - image: debian:stable
    resource_class: large
    environment:
      - VERBOSE: "1"
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run benchmarks
          command: ./polymesh-benchmarks benchmark pallet -p=* -e=* -r 1 -s 2 --execution wasm --wasm-execution compiled --db-cache 512 --heap-pages=4096
          no_output_timeout: 30m
  migration-tests:
    docker:
      - image: polymeshassociation/rust:debian-nightly-2025-12-01
    resource_class: large
    environment:
      - VERBOSE: "1"
      - RUSTFLAGS: -D warnings
      - BUILD_DUMMY_WASM_BINARY: "1"
    steps:
      - checkout
      - setup-sccache
      - restore-sccache-cache
      - run:
          name: Run migration tests
          command: cargo test -p migration-tests --lib -- --nocapture
          no_output_timeout: 30m
      - save-sccache-cache
  test:
    docker:
      - image: polymeshassociation/rust:debian-nightly-2025-12-01
    resource_class: large
    environment:
      - VERBOSE: "1"
      - RUSTFLAGS: -D warnings
      - RUSTC_WRAPPER: /usr/local/cargo/bin/sccache
      - SKIP_WASM_BUILD: "1"
      - RUST_BACKTRACE: "1"
    steps:
      - checkout
      - setup-sccache
      - restore-sccache-cache
      - run:
          name: Tests
          command: >-
            cargo test
            --package pallet-validators
            --package pallet-group
            --package pallet-sudo
            --package pallet-pips
            --package polymesh-primitives
            --package node-rpc-runtime-api
            --package polymesh-runtime-tests
            --package asset-metadata
          no_output_timeout: 30m
      - save-sccache-cache
  coverage:
    docker:
      - image: polymeshassociation/rust:debian-nightly-2025-12-01
    resource_class: xlarge
    environment:
      - VERBOSE: "1"
    steps:
      - checkout
      - setup-sccache
      - restore-sccache-cache
      - run:
          name: Coverage
          command: bash ./scripts/coverage.sh
          no_output_timeout: 30m
      - save-sccache-cache
  rust-integration-test:
    docker:
      - image: polymeshassociation/rust:debian-nightly-2025-12-01
    resource_class: xlarge
    environment:
      - VERBOSE: "1"
      - RUSTFLAGS: -D warnings
      - RUST_BACKTRACE: "1"
      - WAIT_FOR_FINALIZE: "1"
    steps:
      - checkout
      - attach_workspace:
          at: ./assets/ci-runtime
      - run:
          name: Start a Polymesh ci-runtime dev chain using the previous chain version.
          command: >-
            ./assets/ci-runtime/polymesh --bob \
              --chain .ci-chain-specs/v7.4.0.json \
              --unsafe-force-node-key-generation \
              --no-prometheus --no-telemetry --tmp \
              --wasm-execution compiled \
              --pool-limit 100000
          background: true
      - run:
          name: Reset accounts db
          command: ./reset_db.sh
          working_directory: ./integration
      - run:
          name: Run polymesh-api integration tests against the previous version.
          command: cargo nextest run --release --features previous_release --locked
          working_directory: ./integration
          no_output_timeout: 30m
      - run:
          name: Upgrade chain to current version.
          command: cargo run --features previous_release --locked --bin tools -- upgrade_chain ../assets/ci-runtime/polymesh_runtime_develop.compact.compressed.wasm
          working_directory: ./integration
          no_output_timeout: 30m
      - run:
          name: Clear polymesh-api to force re-compile (chain metadata might have changed).
          command: cargo clean -p polymesh-api && cargo clean --release -p polymesh-api
          working_directory: ./integration
      - run:
          name: Run polymesh-api integration tests against the upgraded chain.
          command: cargo nextest run --release --features current_release --locked
          working_directory: ./integration
          no_output_timeout: 30m
  integration-test:
    docker:
      - image: node:18-bookworm
    resource_class: medium+
    environment:
      VERBOSE: "1"
    steps:
      - checkout
      - attach_workspace:
          at: ./assets/ci-runtime
      - run:
          name: run Polymesh ci-runtime dev chain node for integration tests
          command: >-
            ./assets/ci-runtime/polymesh --bob --dev \
              --no-prometheus --no-telemetry --tmp \
              --wasm-execution compiled \
              --pool-limit 100000
          background: true
      - run:
          name: Wait for chain build the genesis config and start producing blocks
          command: sleep 15
      - run:
          name: install and build integration tests
          command: yarn install && yarn build:types && yarn build
          working_directory: ./scripts/cli
          no_output_timeout: 30m
      - run:
          name: run integration tests
          command: yarn test
          working_directory: ./scripts/cli
          no_output_timeout: 10m
  clippy:
    docker:
      - image: polymeshassociation/rust:debian-nightly-2025-12-01
    resource_class: xlarge
    environment:
      - VERBOSE: "1"
      - SKIP_WASM_BUILD: "1"
    steps:
      - checkout
      - setup-sccache
      - restore-sccache-cache
      - run:
          name: run clippy
          command: cargo clippy -- -A clippy::all -W clippy::complexity -W clippy::perf
          no_output_timeout: 30m
      - save-sccache-cache
  build-docker-amd64-debian:
    environment:
      IMAGE_NAME: polymeshassociation/polymesh-amd64
    docker:
      - image: cimg/deploy:2023.08
    resource_class: small
    steps:
      - checkout
      - setup_remote_docker
      - attach_workspace:
          at: .
      - run: |
          export VERSION=`./scripts/version.sh "$CIRCLE_BRANCH" "$CIRCLE_SHA1"`
          docker build -f ./.docker/Dockerfile.debian --tag $IMAGE_NAME:latest-$CIRCLE_BRANCH-debian --tag $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-debian .
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker push --all-tags $IMAGE_NAME
  build-docker-amd64-distroless:
    environment:
      IMAGE_NAME: polymeshassociation/polymesh-amd64
    docker:
      - image: cimg/deploy:2023.08
    resource_class: small
    steps:
      - checkout
      - setup_remote_docker
      - attach_workspace:
          at: .
      - run: |
          export VERSION=`./scripts/version.sh "$CIRCLE_BRANCH" "$CIRCLE_SHA1"`
          docker build -f ./.docker/Dockerfile.distroless --tag $IMAGE_NAME:latest-$CIRCLE_BRANCH-distroless --tag $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-distroless .
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker push --all-tags $IMAGE_NAME
  build-docker-ci-runtime:
    environment:
      IMAGE_NAME: polymeshassociation/polymesh-ci
    docker:
      - image: cimg/deploy:2023.08
    resource_class: small
    steps:
      - checkout
      - setup_remote_docker
      - attach_workspace:
          at: .
      - run: |
          export VERSION=`./scripts/version.sh "$CIRCLE_BRANCH" "$CIRCLE_SHA1"`
          docker build -f ./.docker/Dockerfile.debian --tag $IMAGE_NAME:latest-$CIRCLE_BRANCH-debian --tag $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-debian .
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker push --all-tags $IMAGE_NAME
  build-docker-arm64-debian:
    environment:
      IMAGE_NAME: polymeshassociation/polymesh-arm64
    machine:
      image: ubuntu-2004:current
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: |
          export VERSION=`./scripts/version.sh "$CIRCLE_BRANCH" "$CIRCLE_SHA1"`
          docker build -f ./.docker/arm64/Dockerfile.debian --tag $IMAGE_NAME:latest-$CIRCLE_BRANCH-debian --tag $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-debian .
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker push --all-tags $IMAGE_NAME
  build-docker-arm64-distroless:
    environment:
      IMAGE_NAME: polymeshassociation/polymesh-arm64
    machine:
      image: ubuntu-2004:current
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: |
          export VERSION=`./scripts/version.sh "$CIRCLE_BRANCH" "$CIRCLE_SHA1"`
          docker build -f ./.docker/arm64/Dockerfile.distroless --tag $IMAGE_NAME:latest-$CIRCLE_BRANCH-distroless --tag $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-distroless .
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker push --all-tags $IMAGE_NAME
  build-docker-debian:
    environment:
      IMAGE_NAME: polymeshassociation/polymesh
      IMAGE_AMD_NAME: polymeshassociation/polymesh-amd64
      IMAGE_ARM_NAME: polymeshassociation/polymesh-arm64
    docker:
      - image: cimg/deploy:2023.08
    resource_class: small
    steps:
      - checkout
      - setup_remote_docker
      - run: |
          export VERSION=`./scripts/version.sh "$CIRCLE_BRANCH" "$CIRCLE_SHA1"`
          docker manifest create $IMAGE_NAME:latest-$CIRCLE_BRANCH-debian $IMAGE_AMD_NAME:latest-$CIRCLE_BRANCH-debian $IMAGE_ARM_NAME:latest-$CIRCLE_BRANCH-debian
          docker manifest create $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-debian $IMAGE_AMD_NAME:$VERSION-$CIRCLE_BRANCH-debian $IMAGE_ARM_NAME:$VERSION-$CIRCLE_BRANCH-debian
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker manifest push $IMAGE_NAME:latest-$CIRCLE_BRANCH-debian
          docker manifest push $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-debian
  build-docker-distroless:
    environment:
      IMAGE_NAME: polymeshassociation/polymesh
      IMAGE_AMD_NAME: polymeshassociation/polymesh-amd64
      IMAGE_ARM_NAME: polymeshassociation/polymesh-arm64
    docker:
      - image: cimg/deploy:2023.08
    resource_class: small
    steps:
      - checkout
      - setup_remote_docker
      - run: |
          export VERSION=`./scripts/version.sh "$CIRCLE_BRANCH" "$CIRCLE_SHA1"`
          docker manifest create $IMAGE_NAME:latest-$CIRCLE_BRANCH-distroless $IMAGE_AMD_NAME:latest-$CIRCLE_BRANCH-distroless $IMAGE_ARM_NAME:latest-$CIRCLE_BRANCH-distroless
          docker manifest create $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-distroless $IMAGE_AMD_NAME:$VERSION-$CIRCLE_BRANCH-distroless $IMAGE_ARM_NAME:$VERSION-$CIRCLE_BRANCH-distroless
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker manifest push $IMAGE_NAME:latest-$CIRCLE_BRANCH-distroless
          docker manifest push $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-distroless
  build-docker-eth-rpc-amd64-debian:
    environment:
      IMAGE_NAME: polymeshassociation/polymesh-eth-rpc-amd64
    docker:
      - image: cimg/deploy:2023.08
    resource_class: small
    steps:
      - checkout
      - setup_remote_docker
      - attach_workspace:
          at: .
      - run: |
          export VERSION=`./scripts/version.sh "$CIRCLE_BRANCH" "$CIRCLE_SHA1"`
          docker build -f ./.docker/eth-rpc/Dockerfile --tag $IMAGE_NAME:latest-$CIRCLE_BRANCH-debian --tag $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-debian .
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker push --all-tags $IMAGE_NAME
  build-docker-eth-rpc-arm64-debian:
    environment:
      IMAGE_NAME: polymeshassociation/polymesh-eth-rpc-arm64
    machine:
      image: ubuntu-2004:current
    resource_class: arm.medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: |
          export VERSION=`./scripts/version.sh "$CIRCLE_BRANCH" "$CIRCLE_SHA1"`
          docker build -f ./.docker/eth-rpc/Dockerfile --build-arg ETH_RPC_BIN=eth-rpc-arm64 --tag $IMAGE_NAME:latest-$CIRCLE_BRANCH-debian --tag $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-debian .
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker push --all-tags $IMAGE_NAME
  build-docker-eth-rpc-debian:
    environment:
      IMAGE_NAME: polymeshassociation/polymesh-eth-rpc
      IMAGE_AMD_NAME: polymeshassociation/polymesh-eth-rpc-amd64
      IMAGE_ARM_NAME: polymeshassociation/polymesh-eth-rpc-arm64
    docker:
      - image: cimg/deploy:2023.08
    resource_class: small
    steps:
      - checkout
      - setup_remote_docker
      - run: |
          export VERSION=`./scripts/version.sh "$CIRCLE_BRANCH" "$CIRCLE_SHA1"`
          docker manifest create $IMAGE_NAME:latest-$CIRCLE_BRANCH-debian $IMAGE_AMD_NAME:latest-$CIRCLE_BRANCH-debian $IMAGE_ARM_NAME:latest-$CIRCLE_BRANCH-debian
          docker manifest create $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-debian $IMAGE_AMD_NAME:$VERSION-$CIRCLE_BRANCH-debian $IMAGE_ARM_NAME:$VERSION-$CIRCLE_BRANCH-debian
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker manifest push $IMAGE_NAME:latest-$CIRCLE_BRANCH-debian
          docker manifest push $IMAGE_NAME:$VERSION-$CIRCLE_BRANCH-debian
  build-docker-rust-debian:
    environment:
      RUST_BASE: 1.75.0
      IMAGE_NAME: polymeshassociation/rust
    docker:
      - image: docker:stable-git
    resource_class: large
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run: |
          export NIGHTLY=`date "+nightly-%Y-%m-%d"`
          docker build -f ./.docker/rust-nightly/Dockerfile.debian \
            --build-arg rustbase=$RUST_BASE \
            --build-arg toolchainversion=$NIGHTLY \
            --tag $IMAGE_NAME:latest \
            --tag $IMAGE_NAME:debian --tag $IMAGE_NAME:debian-latest \
            --tag $IMAGE_NAME:debian-$NIGHTLY .
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker push $IMAGE_NAME
  build-docker-rust-alpine:
    environment:
      RUST_BASE: 1.75.0
      IMAGE_NAME: polymeshassociation/rust
    docker:
      - image: docker:stable-git
    resource_class: small
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run: |
          export NIGHTLY=`date "+nightly-%Y-%m-%d"`
          docker build -f ./.docker/rust-nightly/Dockerfile.alpine \
            --build-arg rustbase=$RUST_BASE \
            --build-arg toolchainversion=$NIGHTLY \
            --tag $IMAGE_NAME:alpine --tag $IMAGE_NAME:alpine-latest \
            --tag $IMAGE_NAME:alpine-$NIGHTLY .
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker push $IMAGE_NAME
  build-docker-arm64-rust-debian:
    environment:
      RUST_BASE: 1.75.0
      IMAGE_NAME: polymeshassociation/rust-arm64
    machine:
      image: ubuntu-2004:current
    resource_class: arm.medium
    steps:
      - checkout
      - run: |
          export NIGHTLY=`date "+nightly-%Y-%m-%d"`
          docker build -f ./.docker/arm64/rust/Dockerfile.debian \
            --build-arg rustbase=$RUST_BASE \
            --build-arg toolchainversion=$NIGHTLY \
            --tag $IMAGE_NAME:latest \
            --tag $IMAGE_NAME:debian --tag $IMAGE_NAME:debian-latest \
            --tag $IMAGE_NAME:debian-$NIGHTLY .
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker push --all-tags $IMAGE_NAME
  build-docker-arm64-rust-alpine:
    environment:
      RUST_BASE: 1.75.0
      IMAGE_NAME: polymeshassociation/rust-arm64
    machine:
      image: ubuntu-2004:current
    resource_class: arm.medium
    steps:
      - checkout
      - run: |
          export NIGHTLY=`date "+nightly-%Y-%m-%d"`
          docker build -f ./.docker/arm64/rust/Dockerfile.alpine \
            --build-arg rustbase=$RUST_BASE \
            --build-arg toolchainversion=$NIGHTLY \
            --tag $IMAGE_NAME:alpine --tag $IMAGE_NAME:alpine-latest \
            --tag $IMAGE_NAME:alpine-$NIGHTLY .
          echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker push --all-tags $IMAGE_NAME
  publish-github-release:
    docker:
      - image: cimg/go:1.21.3
    steps:
      - attach_workspace:
          at: ./assets
      - run:
          name: "Publish Release on GitHub"
          command: |
            go install github.com/tcnksm/ghr@latest
            cd assets
            VERSION=$(./polymesh --version | cut -d " " -f2)

            # polymesh x86_64
            mv ./polymesh ./polymesh-${VERSION}
            sha256sum ./polymesh-${VERSION} > ./polymesh-${VERSION}.sha256
            zip -rm ./polymesh-${VERSION}.zip ./polymesh-${VERSION} ./polymesh-${VERSION}.sha256
            zip -T ./polymesh-${VERSION}.zip

            # polymesh arm64
            mv ./polymesh-arm64 ./polymesh-${VERSION}-arm64
            sha256sum ./polymesh-${VERSION}-arm64 > ./polymesh-${VERSION}-arm64.sha256
            zip -rm ./polymesh-${VERSION}-linux-arm64.zip ./polymesh-${VERSION}-arm64 ./polymesh-${VERSION}-arm64.sha256
            zip -T ./polymesh-${VERSION}-linux-arm64.zip

            # polymesh wasm
            for file in *.wasm; do sha256sum "$file" > "${file}.sha256"; done
            zip -rm ./polymesh-${VERSION}-wasm.zip ./*.wasm ./*.wasm.sha256 ./*-srtool-digest.json
            zip -T ./polymesh-${VERSION}-wasm.zip

            # checksum file
            sha256sum ./polymesh-${VERSION}.zip ./polymesh-${VERSION}-linux-arm64.zip ./polymesh-${VERSION}-wasm.zip | sed 's/^/sha256: /' > ./polymesh-${VERSION}.CHECKSUMS
            sha512sum ./polymesh-${VERSION}.zip ./polymesh-${VERSION}-linux-arm64.zip ./polymesh-${VERSION}-wasm.zip | sed 's/^/sha512: /' >> ./polymesh-${VERSION}.CHECKSUMS
            ghr -t ${GITHUB_TOKEN} -u ${CIRCLE_PROJECT_USERNAME} -r ${CIRCLE_PROJECT_REPONAME} -c ${CIRCLE_SHA1} -prerelease -delete v${VERSION} ./

workflows:
  version: 2
  nightly:
    triggers:
      - schedule:
          cron: "0 23 * * *"
          filters:
            branches:
              only:
                - develop
    jobs:
      - build-docker-rust-debian
      - build-docker-rust-alpine
      - build-docker-arm64-rust-debian
      - build-docker-arm64-rust-alpine
  commit:
    jobs:
      - lint
      - check-storage-version
      - clippy
      - test
      - build
      - build-ci
      - build-arm64
      - benchmark-build
      - coverage
      - rust-integration-test:
          requires:
            - build-ci
      - integration-test:
          requires:
            - build-ci
      - benchmark:
          requires:
            - benchmark-build
      - build-docker-amd64-debian:
          requires:
            - build
          filters:
            branches:
              only:
                - mainnet
                - testnet
                - staging
                - develop
      - build-docker-amd64-distroless:
          requires:
            - build
          filters:
            branches:
              only:
                - mainnet
                - testnet
                - staging
                - develop
      - build-docker-ci-runtime:
          requires:
            - build-ci
          filters:
            branches:
              only:
                - develop
      - build-docker-arm64-debian:
          requires:
            - build-arm64
          filters:
            branches:
              only:
                - mainnet
                - testnet
                - staging
                - develop
      - build-docker-arm64-distroless:
          requires:
            - build-arm64
          filters:
            branches:
              only:
                - mainnet
                - testnet
                - staging
                - develop
      - build-docker-debian:
          requires:
            - build-docker-amd64-debian
            - build-docker-arm64-debian
          filters:
            branches:
              only:
                - mainnet
                - testnet
                - staging
                - develop
      - build-docker-distroless:
          requires:
            - build-docker-amd64-distroless
            - build-docker-arm64-distroless
          filters:
            branches:
              only:
                - mainnet
                - testnet
                - staging
                - develop
      - build-docker-eth-rpc-amd64-debian:
          requires:
            - build
          filters:
            branches:
              only:
                - mainnet
                - testnet
                - staging
                - develop
      - build-docker-eth-rpc-arm64-debian:
          requires:
            - build-arm64
          filters:
            branches:
              only:
                - mainnet
                - testnet
                - staging
                - develop
      - build-docker-eth-rpc-debian:
          requires:
            - build-docker-eth-rpc-amd64-debian
            - build-docker-eth-rpc-arm64-debian
          filters:
            branches:
              only:
                - mainnet
                - testnet
                - staging
                - develop
      - publish-github-release:
          requires:
            - build
            - build-arm64
            - deterministic-wasm-build-mainnet
            - deterministic-wasm-build-testnet
          filters:
            branches:
              only:
                - mainnet
                - testnet
                - staging
      - deterministic-wasm-build:
          name: deterministic-wasm-build-testnet
          filters:
            branches:
              only:
                - mainnet
                - testnet
                - staging
          chain: testnet
          package: polymesh-runtime-testnet
          runtime_dir: pallets/runtime/testnet
          tag: 1.81.0
      - deterministic-wasm-build:
          name: deterministic-wasm-build-mainnet
          filters:
            branches:
              only:
                - mainnet
                - testnet
                - staging
          chain: mainnet
          package: polymesh-runtime-mainnet
          runtime_dir: pallets/runtime/mainnet
          tag: 1.81.0
      - deterministic-wasm-build:
          name: deterministic-wasm-build-develop
          filters:
            branches:
              only:
                - develop
          chain: develop
          package: polymesh-runtime-develop
          runtime_dir: pallets/runtime/develop
          tag: 1.81.0
      - metadata-tools-build
      - check_dev_api:
          requires:
            - metadata-tools-build
            - build
      - check_testnet_api:
          requires:
            - metadata-tools-build
            - build
      - check_mainnet_api:
          requires:
            - metadata-tools-build
            - build
