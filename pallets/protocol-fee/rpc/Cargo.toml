[package]
name = "pallet-protocol-fee-rpc"
version = "0.1.0"
authors = ["PolymeshAssociation"]
edition = "2021"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true, default-features = false, features = ["derive"] }
jsonrpsee = { version = "0.24.9", features = ["server-core", "client-core", "macros"] }
sp-api = { workspace = true, default-features = false }
sp-blockchain = { workspace = true }
sp-core = { workspace = true, default-features = false }
sp-rpc = { workspace = true }
sp-runtime = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }

node-rpc = { workspace = true }
polymesh-common-utilities = { workspace = true, default-features = false }
polymesh-primitives = { workspace = true, default-features = false }

# General
serde = { version = "1.0.104", default-features = false, features = ["alloc", "derive"] }
