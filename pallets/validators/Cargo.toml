[package]
name = "pallet-validators"
version = "0.1.0"
authors = ["PolymeshAssociation"]
edition = "2021"

[dependencies]
polymesh-primitives = { workspace = true, default-features = false }
pallet-identity = { workspace = true, default-features = false }

# Substrate staking
pallet-staking = { workspace = true, default-features = false }

# General
static_assertions = "1.1.0"
serde = { version = "1.0.104", default-features = false, features = ["alloc", "derive"] }
log = "0.4.8"

# Substrate
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
sp-core = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false}
sp-runtime = { workspace = true, default-features = false }
sp-arithmetic = { workspace = true, default-features = false }
sp-staking = { workspace = true, default-features = false }
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
frame-election-provider-support = { workspace = true, default-features = false }
sp-npos-elections = { workspace = true, default-features = false}

pallet-session = { features = ["historical"], workspace = true, default-features = false }
pallet-authorship = { workspace = true, default-features = false }
pallet-babe = { workspace = true, default-features = false }

# Optional imports for benchmarking
frame-benchmarking = { workspace = true, default-features = false, optional = true }
rand_chacha = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
frame-benchmarking = { workspace = true, default-features = true }
frame-election-provider-support = { workspace = true, default-features = true }
frame-support = { features = ["experimental"], workspace = true, default-features = true }
pallet-balances = { workspace = true, default-features = true }
pallet-staking = { features = ["testing"], workspace = true, default-features = true }
pallet-staking-reward-curve = { workspace = true, default-features = true }
pallet-timestamp = { workspace = true, default-features = true }
rand_chacha = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-npos-elections = { workspace = true, default-features = true }
sp-tracing = { workspace = true, default-features = true }
substrate-test-utils = { workspace = true }

[features]
default = ["std"]
no_std = []
std = [
	"frame-benchmarking?/std",
	"polymesh-primitives/std",
	"serde/std",
	"codec/std",
	"sp-std/std",
	"sp-npos-elections/std",
	"sp-io/std",
	"frame-support/std",
	"frame-election-provider-support/std",
	"sp-runtime/std",
	"sp-staking/std",
	"pallet-session/std",
	"frame-system/std",
	"pallet-authorship/std",
	"pallet-identity/std",
	"pallet-staking/std",
	"pallet-babe/std",
	"sp-arithmetic/std",
	"rand_chacha",
	"sp-core/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-election-provider-support/runtime-benchmarks",
	"pallet-identity/runtime-benchmarks",
	"pallet-staking/runtime-benchmarks",
	"polymesh-primitives/runtime-benchmarks",
	"rand_chacha",
	"sp-staking/runtime-benchmarks",
]
try-runtime = []
testing = [
  "frame-benchmarking",
	"pallet-staking/testing",
  "rand_chacha",
]
