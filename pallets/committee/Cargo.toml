[package]
name = "pallet-committee"
version = "0.1.0"
authors = ["PolymeshAssociation"]
edition = "2021"

[dependencies]
pallet-permissions = { workspace = true, default-features = false }
polymesh-primitives = { workspace = true, default-features = false  }
pallet-identity = { workspace = true, default-features = false  }

# General
serde = { version = "1.0.104", default-features = false }
serde_derive = { version = "1.0.104", optional = true, default-features = false }

# Substrate
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
sp-core = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-version = { workspace = true, default-features = false }
sp-api = { workspace = true, default-features = false }

frame-system = { workspace = true, default-features = false }
frame-support = { workspace = true, default-features = false }
pallet-timestamp = { workspace = true, default-features = false }

frame-benchmarking = { workspace = true, default-features = false, optional = true }

[features]
equalize = []
default = ["std", "equalize"]
no_std = []
only-staking = []
std = [
	"serde_derive",
	"serde/std",
	"codec/std",
	"sp-std/std",
	"sp-io/std",
	"sp-core/std",
	"sp-runtime/std",
	"sp-api/std",
	"sp-version/std",
	"frame-system/std",
	"frame-support/std",
	"pallet-timestamp/std",
	"polymesh-primitives/std",
	"pallet-identity/std",
]
try-runtime = ["frame-support/try-runtime"]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"pallet-identity/runtime-benchmarks",
	"polymesh-primitives/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
