[package]
name = "polymesh-runtime-testnet"
version = "0.1.0"
authors = ["PolymeshAssociation"]
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

