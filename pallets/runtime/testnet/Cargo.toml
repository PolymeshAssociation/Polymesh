[build-dependencies]
polymesh-build-tool = { workspace = true, default-features = false, optional = true }

[features]
default = ["std", "equalize"]
disable_fees = ["polymesh-transaction-payment/disable_fees"]
equalize = []
testing = []

# Backends
u64_backend = ["polymesh-primitives/u64_backend"]

migration-dry-run = []
