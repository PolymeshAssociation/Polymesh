[package]
name = "pallet-confidential-assets-rpc-runtime-api"
version = "0.1.0"
authors = ["PolymeshAssociation"]
edition = "2021"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
polymesh-dart = { workspace = true, default-features = false, features = ["backend_bp"] }
polymesh-primitives = { workspace = true, default-features = false }

codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
sp-api = { workspace = true, default-features = false }
sp-weights = { workspace = true, default-features = false }

[features]
default = ["std"]
no_std = [
    "polymesh-dart/no_std",
    "polymesh-primitives/no_std",
    "polymesh-primitives/u64_backend",
]
std = [
    "codec/std",
    "polymesh-dart/std",
    "polymesh-primitives/std",
    "scale-info/std",
    "sp-api/std",
    "sp-weights/std",
]