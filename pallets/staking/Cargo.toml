[package]
name = "pallet-staking"
version = "2.0.0"
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2021"

[dependencies]
polymesh-primitives = { workspace = true, default-features = false }
pallet-identity = { workspace = true, default-features = false}

# General
static_assertions = "1.1.0"
serde = { version = "1.0.104", optional = true }
log = "0.4.8"

# Substrate
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { version = "2.0", default-features = false, features = ["derive"] }
sp-core = { version = "7.0.0", default-features = false }
sp-std = { version = "5.0.0", default-features = false }
sp-io = { version = "7.0.0", default-features = false}
sp-runtime = { version = "7.0.0", default-features = false }
sp-arithmetic = { version = "6.0.0", default-features = false }
sp-staking = { version = "4.0.0-dev", default-features = false }
frame-support = { version = "4.0.0-dev", default-features = false }
frame-system = { version = "4.0.0-dev", default-features = false }
frame-election-provider-support = { version = "4.0.0-dev", default-features = false }
sp-npos-elections = { version = "4.0.0-dev", default-features = false}

pallet-session = { features = ["historical"], version = "4.0.0-dev", default-features = false }
pallet-authorship = { version = "4.0.0-dev", default-features = false }
pallet-babe = { version = "4.0.0-dev", default-features = false }

# Optional imports for benchmarking
frame-benchmarking = { version = "4.0.0-dev", default-features = false, optional = true }
rand_chacha = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
sp-tracing = "6.0.0"
sp-core = { version = "7.0.0" }
sp-npos-elections = { version = "4.0.0-dev" }
pallet-balances = { version = "4.0.0-dev" }
pallet-timestamp = { version = "4.0.0-dev" }
pallet-staking-reward-curve = { version = "4.0.0-dev", default-features = false }
pallet-bags-list = { version = "4.0.0-dev" }
substrate-test-utils = { version = "4.0.0-dev" }
frame-benchmarking = { version = "4.0.0-dev" }
frame-election-provider-support = { version = "4.0.0-dev" }
rand_chacha = { version = "0.2" }

[features]
default = ["std"]
no_std = []
std = [
	"polymesh-primitives/std",
	"serde",
	"codec/std",
	"sp-std/std",
	"sp-npos-elections/std",
	"sp-io/std",
	"frame-support/std",
	"frame-election-provider-support/std",
	"sp-runtime/std",
	"sp-staking/std",
	"pallet-session/std",
	"frame-system/std",
	"pallet-authorship/std",
	"pallet-identity/std",
	"pallet-babe/std",
	"sp-arithmetic/std",
	"rand_chacha",
]
runtime-benchmarks = [
	"frame-benchmarking",
	"rand_chacha",
]
try-runtime = []
