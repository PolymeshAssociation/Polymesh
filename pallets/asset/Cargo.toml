[package]
name = "pallet-asset"
version = "0.1.0"
authors = ["PolymeshAssociation"]
edition = "2021"

[dependencies]
# Common
polymesh-common-utilities = { workspace = true, default-features = false }
polymesh-primitives = { workspace = true, default-features = false }
polymesh-primitives-derive = { workspace = true, default-features = false }

# Our Pallets
pallet-base = { workspace = true, default-features = false  }
pallet-external-agents = { workspace = true, default-features = false }
pallet-identity = { workspace = true, default-features = false }
pallet-permissions = { workspace = true, default-features = false }
pallet-portfolio = { workspace = true, default-features = false }
pallet-statistics = { workspace = true, default-features = false }
polymesh-runtime-common = { workspace = true, default-features = false }

# Other
serde = { version = "1.0.104", default-features = false }
serde_derive = { version = "1.0.104", optional = true, default-features = false }
serde_json = "1.0.48"
rustc-hex = { version = "2.1.0", default-features = false }
hex-literal = "0.2.1"
arrayvec = { version = "0.7.1", default-features = false }
log = "0.4"

# Substrate
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { version = "2.0", default-features = false, features = ["derive"] }
sp-arithmetic = { version = "6.0.0", default-features = false }
sp-core = { version = "7.0.0", default-features = false }
sp-std = { version = "5.0.0", default-features = false }
sp-io = { version = "7.0.0", default-features = false }
sp-runtime = { version = "7.0.0", default-features = false }
sp-version = { version = "5.0.0", default-features = false }
sp-api = { version = "4.0.0-dev", default-features = false }
frame-system = { version = "4.0.0-dev", default-features = false }
frame-support = { version = "4.0.0-dev", default-features = false }
pallet-timestamp = { version = "4.0.0-dev", default-features = false }

# Only in STD
frame-benchmarking = { version = "4.0.0-dev", default-features = false, optional = true }

[features]
default = ["std"]
no_std = []
std = [
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-base/std",
    "pallet-identity/std",
    "pallet-portfolio/std",
    "pallet-timestamp/std",
    "pallet-external-agents/std",
    "polymesh-primitives/std",
    "polymesh-common-utilities/std",
    "polymesh-runtime-common/std",
    "rustc-hex/std",
    "serde/std",
    "serde_derive",
    "sp-api/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-version/std",
    "sp-arithmetic/std"
]
runtime-benchmarks = [
    "frame-benchmarking",
    "pallet-identity/runtime-benchmarks",
]
