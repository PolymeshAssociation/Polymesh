[package]
name = "polymesh"
version = "8.0.0"
authors = ["PolymeshAssociation"]
build = "build.rs"
edition = "2021"

[[bin]]
name = "polymesh"
path = "src/bin/main.rs"

[patch.crates-io]
# Patch this to avoid duplicate deps (subxt uses this dep).
sp-crypto-hashing = { git = "https://github.com/PolymeshAssociation/polkadot-sdk", branch = "polymesh-v8-stable2603" }

# DART
# Curve tree dependencies
#curve_tree_bulletproofs = { package = "bulletproofs", path = "../curve-trees/bulletproofs" }
#curve_tree_relations = { package = "relations", path = "../curve-trees/relations" }
#ark-ec-divisors = { package = "ark-ec-divisors", path = "../curve-trees/ark-ec-divisors"}
#ark-dlog-gadget = { package = "ark-dlog-gadget", path = "../curve-trees/ark-dlog-gadget"}
# If want to pull code for curve-trees from git, comment above 2 relations and uncomment below 2
curve_tree_bulletproofs = { package = "bulletproofs", git = "https://github.com/PolymeshAssociation/curve-trees", branch = "polymesh" }
curve_tree_relations = { package = "relations", git = "https://github.com/PolymeshAssociation/curve-trees", branch = "polymesh" }
ark-ec-divisors = { package = "ark-ec-divisors", git = "https://github.com/PolymeshAssociation/curve-trees", branch = "polymesh" }
ark-dlog-gadget = { package = "ark-dlog-gadget", git = "https://github.com/PolymeshAssociation/curve-trees", branch = "polymesh" }

#dock_crypto_utils = { path = "../crypto/utils" }
#schnorr_pok = { path = "../crypto/schnorr_pok" }
dock_crypto_utils = { git = "https://github.com/PolymeshAssociation/crypto", branch = "main" }
schnorr_pok = { git = "https://github.com/PolymeshAssociation/crypto", branch = "main" }

#polymesh-dart = { path = "../polymesh-dart" }
#polymesh-dart-bp = { path = "../polymesh-dart/dart-bp" }
#polymesh-dart-common = { path = "../polymesh-dart/dart-common" }
polymesh-dart = { git = "https://github.com/PolymeshAssociation/polymesh-dart", branch = "main" }
polymesh-dart-bp = { git = "https://github.com/PolymeshAssociation/polymesh-dart", branch = "main" }
polymesh-dart-common = { git = "https://github.com/PolymeshAssociation/polymesh-dart", branch = "main" }

# Polymesh changes to Arkworks.
#ark-serialize = { path = "../arkworks-algebra/serialize" }
#ark-ec = { path = "../arkworks-algebra/ec" }
#ark-ff = { path = "../arkworks-algebra/ff" }
#ark-pallas = { path = "../arkworks-algebra/curves/pallas" }
#ark-vesta = { path = "../arkworks-algebra/curves/vesta" }
#ark-helios = { path = "../arkworks-algebra/curves/helios" }
#ark-selene = { path = "../arkworks-algebra/curves/selene" }
#ark-wei25519 = { path = "../arkworks-algebra/curves/wei25519" }
#ark-curve25519 = { path = "../arkworks-algebra/curves/curve25519" }
#ark-ed25519 = { path = "../arkworks-algebra/curves/ed25519" }
ark-serialize = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-ec = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-ff = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-pallas = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-vesta = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-bls12-381 = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-bls12-377 = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-bn254 = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-helios = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-selene = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-wei25519 = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-curve25519 = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-ed25519 = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }

[workspace]
members = [
    "eth-rpc",
    "node-rpc",
    "worker",
    "worker/protocol/common",
    "worker/protocol/dart-v0",
    "pallets/asset",
    "pallets/base",
    "pallets/committee",
    "pallets/compliance-manager",
    "pallets/confidential-assets",
    "pallets/confidential-assets/host-functions",
    "pallets/contracts",
    "pallets/corporate-actions",
    "pallets/external-agents",
    "pallets/group",
    "pallets/group/rpc",
    "pallets/group/rpc/runtime-api",
    "pallets/identity",
    "pallets/multisig",
    "pallets/nft",
    "pallets/pips",
    "pallets/protocol-fee",
    "pallets/protocol-fee/rpc",
    "pallets/protocol-fee/rpc/runtime-api",
    "pallets/relayer",
    "pallets/runtime/common",
    "pallets/runtime/develop",
    "pallets/runtime/mainnet",
    "pallets/runtime/testnet",
    "pallets/runtime/tests",
    "pallets/runtime/tests/exec_macro",
    "pallets/settlement",
    "pallets/statistics",
    "pallets/sto",
    "pallets/validators",
    "pallets/transaction-payment",
    "pallets/treasury",
    "pallets/utility",
    "pallets/weights",
    "primitives",
    "primitives_derive",
    "primitives/asset-metadata",
    "rpc",
    "rpc/runtime-api",
]
exclude = ["contracts", "integration", "metadata-tools"]

[workspace.package]
version = "8.0.0"
authors = ["PolymeshAssociation"]
edition = "2021"
repository = "https://github.com/PolymeshAssociation/Polymesh"
homepage = "https://github.com/PolymeshAssociation/Polymesh"

## Keep common dependencies here.
[workspace.dependencies]
# Polymesh worker host functions and protocols.
polymesh-worker = { path = "worker", default-features = false }
polymesh-worker-protocol-common = { path = "worker/protocol/common", default-features = false }
polymesh-worker-protocol-dart-v0 = { path = "worker/protocol/dart-v0", default-features = false }

# Polkavm for protocol workers.
polkavm = { version = "0.32", default-features = false }
polkavm-derive = { version = "0.32", default-features = false }

# Our pallets
pallet-asset = { path = "pallets/asset", default-features = false }
pallet-base = { path = "pallets/base", default-features = false }
pallet-committee = { path = "pallets/committee", default-features = false }
pallet-compliance-manager = { path = "pallets/compliance-manager", default-features = false }
pallet-confidential-assets = { path = "pallets/confidential-assets", default-features = false }
polymesh-dart-host-functions = { path = "pallets/confidential-assets/host-functions/", default-features = false }
pallet-corporate-actions = { path = "pallets/corporate-actions", default-features = false }
pallet-external-agents = { path = "pallets/external-agents", default-features = false }
pallet-group = { path = "pallets/group", default-features = false }
pallet-identity = { path = "pallets/identity", default-features = false }
pallet-multisig = { path = "pallets/multisig", default-features = false }
pallet-nft = { path = "pallets/nft", default-features = false }
pallet-permissions = { path = "pallets/permissions", default-features = false }
pallet-pips = { path = "pallets/pips", default-features = false }
pallet-portfolio = { path = "pallets/portfolio", default-features = false }
pallet-protocol-fee = { path = "pallets/protocol-fee", default-features = false }
pallet-relayer = { path = "pallets/relayer", default-features = false }
pallet-sto = { path = "pallets/sto", default-features = false }
pallet-settlement = { path = "pallets/settlement", default-features = false }
pallet-validators = { path = "pallets/validators", default-features = false }
pallet-statistics = { path = "pallets/statistics", default-features = false }
polymesh-transaction-payment = { path = "pallets/transaction-payment", default-features = false }
pallet-treasury = { path = "pallets/treasury", default-features = false }
pallet-utility = { path = "pallets/utility", default-features = false }
polymesh-contracts = { path = "pallets/contracts", default-features = false }

# Common
polymesh-runtime-common = { path = "pallets/runtime/common", default-features = false }
polymesh-primitives = { path = "primitives", default-features = false }
polymesh-primitives-derive = { path = "primitives_derive", default-features = false }
polymesh-weights = { path = "pallets/weights/", default-features = false }

# RPC
node-rpc = { path = "rpc", default-features = false }
node-rpc-runtime-api = { path = "rpc/runtime-api", default-features = false }
pallet-group-rpc = { path = "pallets/group/rpc", default-features = false }
pallet-group-rpc-runtime-api = { path = "pallets/group/rpc/runtime-api", default-features = false }
pallet-protocol-fee-rpc = { path = "pallets/protocol-fee/rpc", default-features = false }
pallet-protocol-fee-rpc-runtime-api = { path = "pallets/protocol-fee/rpc/runtime-api", default-features = false }
polymesh-node-rpc = { path = "node-rpc", default-features = false }

# Runtimes
polymesh-runtime-develop = { path = "pallets/runtime/develop" }
polymesh-runtime-mainnet = { path = "pallets/runtime/mainnet" }
polymesh-runtime-testnet = { path = "pallets/runtime/testnet" }

# Build tool
polymesh-build-tool = { path = "pallets/runtime/build_tool", default-features = false }

# SCALE Codec deps.
codec = { package = "parity-scale-codec", version = "3.7.4", default-features = false, features = [
    "derive",
    "max-encoded-len",
] }
scale-info = { version = "2.11.6", default-features = false, features = [
    "derive",
] }
bounded-collections = { version = "0.3.2", default-features = false }

# Substrate pallet/runtime deps.
