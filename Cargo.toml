[features]
default = ["std"]
disable_fees = [
    "polymesh-transaction-payment/disable_fees",
    "polymesh-runtime-develop/disable_fees",
    "polymesh-runtime-mainnet/disable_fees",
    "polymesh-runtime-testnet/disable_fees",
]
running-ci = ["polymesh-runtime-develop/running-ci"]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-benchmarking-cli/runtime-benchmarks",
    "sc-client-db/runtime-benchmarks",
    "polymesh-runtime-develop/runtime-benchmarks",
    "polymesh-runtime-testnet/runtime-benchmarks",
    "polymesh-runtime-mainnet/runtime-benchmarks",
    "polymesh-dart-host-functions/runtime-benchmarks",
]

# Only build a "ci" runtime.
ci-runtime = ["polymesh-runtime-develop/ci-runtime"]

metadata-hash = [
    "polymesh-runtime-develop/metadata-hash",
    "polymesh-runtime-mainnet/metadata-hash",
    "polymesh-runtime-testnet/metadata-hash",
]

