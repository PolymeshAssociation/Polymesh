[package]
name = "pallet-revive-eth-rpc"
version = "0.12.0"
authors.workspace = true
edition = "2021"
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "An Ethereum JSON-RPC server for pallet-revive."
default-run = "eth-rpc"

#[lints]
#workspace = true

[package.metadata.polkadot-sdk]
exclude-from-umbrella = true

[[bin]]
name = "eth-rpc"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.81", default-features = false }
clap = { version = "4.5.13", features = ["derive", "env"] }
codec = { workspace = true, features = ["derive"] }
futures = { version = "0.3.31", features = ["thread-pool"] }
hex = { version = "0.4.3", default-features = false }
jsonrpsee = { version = "0.24.10", features = ["full"] }
log = { version = "0.4.22", default-features = false }
pallet-revive.default-features = true
pallet-revive.workspace = true
prometheus-endpoint.default-features = true
prometheus-endpoint.workspace = true
rlp = { version = "0.6.1", default-features = false }
sc-cli.default-features = true
sc-cli.workspace = true
sc-rpc.default-features = true
sc-rpc.workspace = true
sc-rpc-api.default-features = true
sc-rpc-api.workspace = true
sc-service.default-features = true
sc-service.workspace = true
serde = { version = "1.0.214", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.132", default-features = false }
sp-arithmetic.default-features = true
sp-arithmetic.workspace = true
sp-core.default-features = true
sp-core.workspace = true
sp-crypto-hashing.workspace = true
sp-rpc.default-features = true
sp-rpc.workspace = true
sp-runtime.default-features = true
sp-runtime.workspace = true
sp-timestamp.workspace = true
sp-weights.default-features = true
sp-weights.workspace = true
sqlx = { version = "0.8.2", features = ["macros", "runtime-tokio", "sqlite"] }
subxt = { version = "0.43", default-features = true, features = ["reconnecting-rpc-client"] }
subxt-signer = { version = "0.43", features = ["unstable-eth"] }
thiserror = { version = "1.0.64" }
tokio = { version = "1.45.0", default-features = false, features = ["full"] }

[dev-dependencies]
env_logger = { version = "0.11.2" }
pallet-revive-fixtures = { default-features = true, workspace = true }
pretty_assertions = { version = "1.3.0" }
#revive-dev-node = { git = "https://github.com/PolymeshAssociation/polkadot-sdk", branch = "polymesh-v8-stable2512", default-features = false }
polymesh = { path = "../", default-features = true }
sp-io = { default-features = true, workspace = true }

[build-dependencies]
git2 = { version = "0.20.0", default-features = false }
#revive-dev-runtime = { git = "https://github.com/PolymeshAssociation/polkadot-sdk", branch = "polymesh-v8-stable2512", default-features = true }
polymesh-runtime-develop = { workspace = true, default-features = true }
sp-io.default-features = true
sp-io.workspace = true
sp-runtime.default-features = true
sp-runtime.workspace = true
