[package]
name = "metadata-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
frame-metadata = { version = "16.0", features = ["std", "legacy"] }
codec = { package = "parity-scale-codec", version = "3.0", features = [
    "derive",
] }
anyhow = "1.0"
substrate-differ = { git = "https://github.com/chevdor/subwasm.git", tag = "v0.21.3" }
jsonrpsee = { version = "0.24.7", features = [
    "client",
    "http-client",
    "ws-client",
] }
hex = "0.4.3"
tokio = { version = "1.42.0", features = ["full"] }
